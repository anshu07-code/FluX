# Production infrastructure — PostgreSQL + Kafka on one host.
# App services (frontend, api, processor, worker, scheduler) run on the host
# under pm2 (see ecosystem.config.js): `next build`/`tsc` run on the machine so
# a small VPS never OOMs inside a container build.
#
# Both ports bind to 127.0.0.1 only — never exposed to the internet.
# Started with: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:15
    container_name: flux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: synx
      POSTGRES_PASSWORD: synxpass
      POSTGRES_DB: flux
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flux-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synx -d flux"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: flux-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
      # Keep the JVM inside a 4 GB box comfortably (default heap is 1 GB).
      KAFKA_HEAP_OPTS: "-Xmx768M -Xms256M"
    volumes:
      - flux-kraft:/var/lib/kafka/data

volumes:
  flux-pgdata:
  flux-kraft:
